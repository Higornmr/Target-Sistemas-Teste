<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Projeto</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <h1>Olá!</h1>
        <div>
            <h2>Imprima o valor da Técnica desejada!</h2>
        </div>
        
        <div class="containerTechnique">
            <div class="techniqueItem">
                <p class="TechniqueTitle">Técnica 1</p>
                <button class="buttonDefaut primeira">Imprimir</button>
            </div>
            <div class="techniqueItem">
                <p class="TechniqueTitle">Técnica 2</p>
                <button class="buttonDefaut segunda">Imprimir</button>
            </div>
            <div class="techniqueItem">
                <p class="TechniqueTitle">Técnica 3</p>
                <button class="buttonDefaut terceira">Imprimir</button>
            </div>
            <div class="techniqueItem">
                <p class="TechniqueTitle">Técnica 4</p>
                <button class="buttonDefaut quarta">Imprimir</button>
            </div>
            <div class="techniqueItem">
                <p class="TechniqueTitle">Técnica 5 (escreva a palavra desejada)</p>
                <input type="text" class="inputTexto" placeholder="Digite algo">
                <button class="buttonDefaut quinta">Imprimir</button>
            </div>       
        </div>
        <div class="resultContainer">
            <p>Resposta:</p>
            <div class="result"></div>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
